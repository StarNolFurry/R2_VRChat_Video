name = 'r2-vrchat-video'
main = "src/index.js"
compatibility_date = "2024-01-01"

# R2 存储桶绑定
[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "https://a69c607f7ada3aeea2b0cf0c5a86f6bc.r2.cloudflarestorage.com/vrchatmv"

# KV 存储绑定
[[kv_namespaces]]
binding = "VIDEO_INDEX"
id = "your-kv-namespace-id"

# 环境变量（部署时请覆盖）
[vars]
ADMIN_URL = "/admin-secret-path"
# ADMIN_PASS 和 SESSION_SECRET 请通过 wrangler secret put 设置，不要写入此处
